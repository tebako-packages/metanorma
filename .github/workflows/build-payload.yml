name: build-payload
# Feedstock build: recipe → per-triplet legs → boot-smoke → release.
# Conventions: docs/conventions.md in tebako-packages/index.
#
# STATUS:
#   aarch64-macos — green: build + boot smoke; tags publish.
#   x86_64-windows-ucrt — the BUILD is green (staging incl. the six
#   source-built natives, image, manifest). The boot smoke is pinned to a
#   KNOWN runtime-layer blocker: current windows-ucrt64 runtimes cannot
#   load dynamically linked native extensions at all — the interpreter is
#   --disable-shared/--with-static-linked-ext, exports no symbols, and the
#   release ships no ruby DLL, so nokogiri/ffi/ox/psych/... .so files have
#   nothing to bind to (docs/build-notes.md § Windows). tools/smoke_verdict
#   turns exactly that signature green and fails any other failure mode;
#   NO windows artifact publishes until the runtime factory ships a
#   symbol provider and the gate here is enforced.
on:
  push:
    branches: [main]
    tags: ["*"]
  pull_request:
  workflow_dispatch:

# One run per branch/PR-head at a time: pushing to a branch with an open
# PR would otherwise run every job twice (push + pull_request events);
# a new run cancels the stale one.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  build:
    name: aarch64-macos
    runs-on: macos-14
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Fetch tebako CLI tools (tamatebako/tebako v0.1.2, sha256-pinned)
        # The packager is the RELEASE BINARY (releases are the
        # interface); the digests are pinned here and cross-checked
        # against the release's SHA256SUMS (provenance: docs/build-notes.md).
        run: |
          mkdir -p "$RUNNER_TEMP/tebako-tools" && cd "$RUNNER_TEMP/tebako-tools"
          base="https://github.com/tamatebako/tebako/releases/download/v0.1.2"
          curl -sLO "$base/tebako-0.1.2-macos-arm64"
          curl -sLO "$base/tfs-0.1.2-macos-arm64"
          echo "9d8328168b93c1828059ba90baf13b4855a7de483b25ae9df9c596c1e83634a3  tebako-0.1.2-macos-arm64" > SHA256PINS
          echo "4b791be221501e03f2f64af155ebe6ef903f3a4a2c25733d93bfa2afb3165688  tfs-0.1.2-macos-arm64" >> SHA256PINS
          shasum -a 256 -c SHA256PINS
          chmod 755 tebako-0.1.2-macos-arm64 tfs-0.1.2-macos-arm64
          mv tebako-0.1.2-macos-arm64 tebako
          mv tfs-0.1.2-macos-arm64 tfs
          echo "$RUNNER_TEMP/tebako-tools" >> "$GITHUB_PATH"

      - name: Build the payload
        env:
          TEBAKO_CLI: tebako
          TFS_CLI: tfs
        run: tools/build

      - name: Boot-smoke
        # Hard rule (docs/conventions.md): the packaged tool's version
        # command runs from the image before any release publishes.
        env:
          TFS: tfs
        run: |
          . out/aarch64-macos/runtime.env
          TFS="$TFS" RUNTIME="$RUNTIME" RUNTIME_IMAGE="$RUNTIME_IMAGE" \
            tools/boot_smoke out/aarch64-macos/metanorma-1.16.9-macos-arm64.tfs

      - name: Stage artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-aarch64-macos
          path: out/aarch64-macos/

  build-windows:
    name: x86_64-windows-ucrt
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up MSYS2 (ucrt64 toolchain for the ruby SDK + the six natives)
        # gcc-libs rides along for the msys2 toolchain's own binaries;
        # the v0.1.2 tebako windows binaries are statically linked (the
        # release's ship gate audits PE imports).
        uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884 # v2.32.0
        with:
          msystem: ucrt64
          path-type: minimal
          install: >-
            make
            patch
            tar
            curl
            mingw-w64-ucrt-x86_64-toolchain
            mingw-w64-ucrt-x86_64-gcc-libs

      - name: Fetch tebako CLI tools (tamatebako/tebako v0.1.2, sha256-pinned)
        # the matrix context is not available to step-level `shell`, so
        # the windows leg gets its own steps with the literal msys2 keyword
        shell: msys2 {0}
        run: |
          mkdir -p "$RUNNER_TEMP/tebako-tools" && cd "$RUNNER_TEMP/tebako-tools"
          base="https://github.com/tamatebako/tebako/releases/download/v0.1.2"
          curl -sLO "$base/tebako-0.1.2-windows-ucrt64.exe"
          curl -sLO "$base/tfs-0.1.2-windows-ucrt64.exe"
          echo "00f1990c74c3eae1eb2328b67d441eaa4f6ab34f25887dec89d3e058d72d116a  tebako-0.1.2-windows-ucrt64.exe" > SHA256PINS
          echo "66173b956ffd839d16954a3659177cbc2dc7bae6ba7b5330b1eb26bf83a4ea95  tfs-0.1.2-windows-ucrt64.exe" >> SHA256PINS
          sha256sum -c SHA256PINS
          cp tebako-0.1.2-windows-ucrt64.exe tebako.exe
          cp tfs-0.1.2-windows-ucrt64.exe tfs.exe
          echo "TEBAKO_TOOLS=$(cygpath -m "$RUNNER_TEMP/tebako-tools")" >> "$GITHUB_ENV"

      - name: Build the payload
        shell: msys2 {0}
        env:
          TRIPLET: x86_64-windows-ucrt
        run: |
          export TEBAKO_CLI="$TEBAKO_TOOLS/tebako.exe"
          export TFS_CLI="$TEBAKO_TOOLS/tfs.exe"
          tools/build

      - name: Boot-smoke + verdict
        # The in-image assertions and the extract round-trip are hard
        # gates. The exec leg is pinned to the KNOWN windows runtime-
        # layer blocker (header comment): only its exact LoadError
        # signature is accepted as green; a PASS or any other failure
        # mode is reported by tools/smoke_verdict (pass flips the gate,
        # anything else fails the leg).
        shell: msys2 {0}
        run: |
          . out/x86_64-windows-ucrt/runtime.env
          set +e
          TFS="$TEBAKO_TOOLS/tfs.exe" RUNTIME="$RUNTIME" RUNTIME_IMAGE="$RUNTIME_IMAGE" \
            tools/boot_smoke out/x86_64-windows-ucrt/metanorma-1.16.9-windows-ucrt64.tfs \
            2>&1 | tee "$RUNNER_TEMP/smoke.log"
          rc=${PIPESTATUS[0]}
          set -e
          tools/smoke_verdict "$rc" "$RUNNER_TEMP/smoke.log"

      - name: Stage artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-x86_64-windows-ucrt
          path: out/x86_64-windows-ucrt/

  release:
    name: publish
    if: startsWith(github.ref, 'refs/tags/')
    # needs the mac leg only: the windows artifact does NOT publish while
    # the runtime-layer native-extension gate stands (header comment); the
    # registry gains the windows entry when the gate is enforced.
    needs: build
    runs-on: macos-14
    env:
      TEBAKO_CLI: ${{ github.workspace }}/.packager/tebako
      TEBAKO_HOME: ${{ github.workspace }}/.tebako
      TEBAKO_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: dist-*
          path: out
          merge-multiple: false
      - name: Restore layout
        # each dist-<triplet> artifact carries the leg's out/<triplet>/
        # contents; put them back at out/<triplet>/ for the publish below
        run: |
          set -e
          for d in out/dist-*/; do
            p="${d#out/dist-}"; p="${p%/}"
            mkdir -p "out/$p"
            mv "$d"* "out/$p/"
            rmdir "$d"
          done
      # The publisher is the product repo's published CLI (releases are
      # the interface), sha256-pinned — never a from-source build.
      - name: Fetch the publisher (tebako release v0.1.2, sha256-pinned)
        run: |
          set -euo pipefail
          mkdir -p .packager
          curl -sL --fail -o .packager/tebako \
            https://github.com/tamatebako/tebako/releases/download/v0.1.2/tebako-0.1.2-macos-arm64
          echo "9d8328168b93c1828059ba90baf13b4855a7de483b25ae9df9c596c1e83634a3  .packager/tebako" \
            | shasum -a 256 -c -
          chmod +x .packager/tebako
          .packager/tebako --help > /dev/null
      - name: Publish payloads + registry
        # tebako publish: artifacts + registry upsert + clean-cache verify
        # (the publisher home carries the dep registries for the closure proof)
        run: |
          set -euo pipefail
          "$TEBAKO_CLI" add-registry tfs:github:tebako-packages/inkscape
          "$TEBAKO_CLI" add-registry tfs:github:tebako-packages/openjdk
          "$TEBAKO_CLI" publish --name metanorma \
            --release "tfs:github:tebako-packages/metanorma:${{ github.ref_name }}" \
            --payload aarch64-macos="out/aarch64-macos/metanorma-1.16.9-macos-arm64.tfs" \
            --registry-out tpkg-registry.yaml
      # main is branch-protected (and the GitHub-Actions bypass is not
      # available on this plan): the registry lands by bot PR + auto-merge,
      # never by direct push. Idempotent across re-runs of the same tag.
      - name: Publish the registry entry via pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "tebako-ci"
          git config user.email "tebako@ribose.com"
          git fetch origin main
          if git diff --quiet origin/main -- tpkg-registry.yaml; then
            echo "registry unchanged (or the entry already landed on main)"
            exit 0
          fi
          branch="publish/${{ github.ref_name }}-registry"
          git checkout -b "$branch"
          git add tpkg-registry.yaml
          git commit -m "publish ${{ github.ref_name }}: registry entry (macos-arm64)"
          git push origin "$branch"
          if ! gh pr view "$branch" >/dev/null 2>&1; then
            gh pr create --base main --head "$branch" \
              --title "publish ${{ github.ref_name }}: registry entry" \
              --body "Automated registry entry for ${{ github.ref_name }} (the build-payload publish job; main is protected, so the registry lands by PR)."
          fi
          gh pr merge --auto --squash "$branch"
