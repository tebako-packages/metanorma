name: build-payload
# Feedstock build: recipe → per-triplet legs → boot-smoke → release.
# Conventions: docs/conventions.md in tebako-packages/index.
#
# STATUS:
#   aarch64-macos — green: build + boot smoke; tags publish.
#   x86_64-linux-gnu — build + boot smoke (ubuntu-24.04, the POSIX shim
#   staging — same shape as the mac leg; the five precompiled natives are
#   the glibc-x86_64 variants); tags publish together with the mac leg.
#   x86_64-windows-ucrt — build + boot smoke ENFORCED: the 0.16.4 runtime
#   line carries the windows runtime-layer fixes the exec gate waited on
#   (the ruby DLL facet + the loader interpose / library_aliases — spec 22
#   phase W2; re-cut green as tebako-runtime-ruby run 32346716268), so
#   tools/smoke_verdict runs enforcing: ANY boot-smoke failure fails the
#   leg. NO windows artifact publishes yet — the publish wiring is the
#   follow-up once this gate proves green (docs/build-notes.md § Windows).
on:
  push:
    branches: [main]
    tags: ["*"]
  pull_request:
  workflow_dispatch:

# One run per branch/PR-head at a time: pushing to a branch with an open
# PR would otherwise run every job twice (push + pull_request events);
# a new run cancels the stale one.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  build:
    name: aarch64-macos
    runs-on: macos-14
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Fetch tebako CLI tools (tamatebako/tebako v0.1.9, sha256-pinned)
        # The packager is the RELEASE BINARY (releases are the
        # interface); the digests are pinned here and cross-checked
        # against the release's SHA256SUMS (provenance: docs/build-notes.md).
        # v0.1.9 floor: the 0.16.4 runtime env images are gem-less (spec 22
        # M2) — earlier CLIs gate the press on the retired tebako-runtime
        # gem (exit 129).
        run: |
          mkdir -p "$RUNNER_TEMP/tebako-tools" && cd "$RUNNER_TEMP/tebako-tools"
          base="https://github.com/tamatebako/tebako/releases/download/v0.1.9"
          curl -sLO "$base/tebako-0.1.9-macos-arm64"
          curl -sLO "$base/tfs-0.1.9-macos-arm64"
          echo "0e0d964ce1f08afa7f6d2d709da0a0f1c7e01b4b01f87530181f0439555755be  tebako-0.1.9-macos-arm64" > SHA256PINS
          echo "3d7ec857b9527a75589e078072248d91dbb443d8c9965a5ce84e5473d8a9edaa  tfs-0.1.9-macos-arm64" >> SHA256PINS
          shasum -a 256 -c SHA256PINS
          chmod 755 tebako-0.1.9-macos-arm64 tfs-0.1.9-macos-arm64
          mv tebako-0.1.9-macos-arm64 tebako
          mv tfs-0.1.9-macos-arm64 tfs
          echo "$RUNNER_TEMP/tebako-tools" >> "$GITHUB_PATH"

      - name: Build the payload
        env:
          TEBAKO_CLI: tebako
          TFS_CLI: tfs
        run: tools/build

      - name: Boot-smoke
        # Hard rule (docs/conventions.md): the packaged tool's version
        # command runs from the image before any release publishes.
        env:
          TFS: tfs
        run: |
          . out/aarch64-macos/runtime.env
          TFS="$TFS" RUNTIME="$RUNTIME" RUNTIME_IMAGE="$RUNTIME_IMAGE" \
            tools/boot_smoke out/aarch64-macos/metanorma-1.16.9-macos-arm64.tfs

      - name: Stage artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-aarch64-macos
          path: out/aarch64-macos/

  build-windows:
    name: x86_64-windows-ucrt
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up MSYS2 (ucrt64 toolchain for the ruby SDK + the six natives)
        # gcc-libs rides along for the msys2 toolchain's own binaries;
        # the v0.1.9 tebako windows binaries are statically linked (the
        # release's ship gate audits PE imports).
        uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884 # v2.32.0
        with:
          msystem: ucrt64
          path-type: minimal
          install: >-
            make
            patch
            tar
            curl
            mingw-w64-ucrt-x86_64-toolchain
            mingw-w64-ucrt-x86_64-gcc-libs

      - name: Fetch tebako CLI tools (tamatebako/tebako v0.1.9, sha256-pinned)
        # the matrix context is not available to step-level `shell`, so
        # the windows leg gets its own steps with the literal msys2 keyword
        shell: msys2 {0}
        run: |
          mkdir -p "$RUNNER_TEMP/tebako-tools" && cd "$RUNNER_TEMP/tebako-tools"
          base="https://github.com/tamatebako/tebako/releases/download/v0.1.9"
          curl -sLO "$base/tebako-0.1.9-windows-ucrt64.exe"
          curl -sLO "$base/tfs-0.1.9-windows-ucrt64.exe"
          echo "859136b63a78a057d6f401e7df5baa50f68fdd0db26dc6e6c29f5f3284e13750  tebako-0.1.9-windows-ucrt64.exe" > SHA256PINS
          echo "44f21e1b7a3ca1aa138c17931669ef7a4e2608d3c166c6951aa5dbd62232978f  tfs-0.1.9-windows-ucrt64.exe" >> SHA256PINS
          sha256sum -c SHA256PINS
          cp tebako-0.1.9-windows-ucrt64.exe tebako.exe
          cp tfs-0.1.9-windows-ucrt64.exe tfs.exe
          echo "TEBAKO_TOOLS=$(cygpath -m "$RUNNER_TEMP/tebako-tools")" >> "$GITHUB_ENV"

      - name: Build the payload
        shell: msys2 {0}
        env:
          TRIPLET: x86_64-windows-ucrt
        run: |
          export TEBAKO_CLI="$TEBAKO_TOOLS/tebako.exe"
          export TFS_CLI="$TEBAKO_TOOLS/tfs.exe"
          tools/build

      - name: Boot-smoke + verdict
        # Fully enforcing (header comment): on the 0.16.4 runtime line the
        # exec leg must PASS — tools/smoke_verdict fails the leg on ANY
        # nonzero rc, classifying the old LoadError signature as a named
        # runtime regression vs. an undiagnosed failure.
        shell: msys2 {0}
        run: |
          . out/x86_64-windows-ucrt/runtime.env
          set +e
          TFS="$TEBAKO_TOOLS/tfs.exe" RUNTIME="$RUNTIME" RUNTIME_IMAGE="$RUNTIME_IMAGE" \
            tools/boot_smoke out/x86_64-windows-ucrt/metanorma-1.16.9-windows-ucrt64.tfs \
            2>&1 | tee "$RUNNER_TEMP/smoke.log"
          rc=${PIPESTATUS[0]}
          set -e
          tools/smoke_verdict "$rc" "$RUNNER_TEMP/smoke.log"

      - name: Stage artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-x86_64-windows-ucrt
          path: out/x86_64-windows-ucrt/

  build-linux:
    name: x86_64-linux-gnu
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Fetch tebako CLI tools (tamatebako/tebako v0.1.9, sha256-pinned)
        # Same pins discipline as the mac leg (the digests are cross-checked
        # against the release's SHA256SUMS); ubuntu has sha256sum, not shasum.
        run: |
          mkdir -p "$RUNNER_TEMP/tebako-tools" && cd "$RUNNER_TEMP/tebako-tools"
          base="https://github.com/tamatebako/tebako/releases/download/v0.1.9"
          curl -sLO "$base/tebako-0.1.9-linux-gnu-x86_64"
          curl -sLO "$base/tfs-0.1.9-linux-gnu-x86_64"
          echo "07c51fd950c3a1be74ecfcc5e6944408fcdbff9d377901dd6af7b595861a1cbb  tebako-0.1.9-linux-gnu-x86_64" > SHA256PINS
          echo "0a07f1188990a1e27244446691f25bf7b5337bc6be10d7e78c9a0147f0654bcf  tfs-0.1.9-linux-gnu-x86_64" >> SHA256PINS
          sha256sum -c SHA256PINS
          chmod 755 tebako-0.1.9-linux-gnu-x86_64 tfs-0.1.9-linux-gnu-x86_64
          mv tebako-0.1.9-linux-gnu-x86_64 tebako
          mv tfs-0.1.9-linux-gnu-x86_64 tfs
          echo "$RUNNER_TEMP/tebako-tools" >> "$GITHUB_PATH"

      - name: Build the payload
        env:
          TRIPLET: x86_64-linux-gnu
          TEBAKO_CLI: tebako
          TFS_CLI: tfs
        run: tools/build

      - name: Boot-smoke
        # Hard gate, same as the mac leg: the packaged tool's version
        # command runs from the image against the linux 0.16.4 runtime
        # (resolved by tools/build's stub press) before any release
        # publishes.
        env:
          TFS: tfs
        run: |
          . out/x86_64-linux-gnu/runtime.env
          TFS="$TFS" RUNTIME="$RUNTIME" RUNTIME_IMAGE="$RUNTIME_IMAGE" \
            tools/boot_smoke out/x86_64-linux-gnu/metanorma-1.16.9-linux-gnu-x86_64.tfs

      - name: Stage artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-x86_64-linux-gnu
          path: out/x86_64-linux-gnu/

  release:
    name: publish
    if: startsWith(github.ref, 'refs/tags/')
    # needs the mac + linux legs: the windows artifact does NOT publish yet —
    # its boot-smoke gate is enforced on the 0.16.4 line (header comment) and
    # the publish wiring (needs + --payload + the registry entry) lands once
    # that gate proves green.
    needs: [build, build-linux]
    runs-on: macos-14
    env:
      TEBAKO_CLI: ${{ github.workspace }}/.packager/tebako
      TEBAKO_HOME: ${{ github.workspace }}/.tebako
      TEBAKO_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: dist-*
          path: out
          merge-multiple: false
      - name: Restore layout
        # each dist-<triplet> artifact carries the leg's out/<triplet>/
        # contents; put them back at out/<triplet>/ for the publish below
        run: |
          set -e
          for d in out/dist-*/; do
            p="${d#out/dist-}"; p="${p%/}"
            mkdir -p "out/$p"
            mv "$d"* "out/$p/"
            rmdir "$d"
          done
      # The publisher is the product repo's published CLI (releases are
      # the interface), sha256-pinned — never a from-source build.
      - name: Fetch the publisher (tebako release v0.1.9, sha256-pinned)
        run: |
          set -euo pipefail
          mkdir -p .packager
          curl -sL --fail -o .packager/tebako \
            https://github.com/tamatebako/tebako/releases/download/v0.1.9/tebako-0.1.9-macos-arm64
          curl -sL --fail -o .packager/tebako-shim \
            https://github.com/tamatebako/tebako/releases/download/v0.1.9/tebako-shim-0.1.9-macos-arm64
          echo "0e0d964ce1f08afa7f6d2d709da0a0f1c7e01b4b01f87530181f0439555755be  .packager/tebako" \
            | shasum -a 256 -c -
          echo "4a4ddb3f38846744a6ca9b09219388adf704b77680ff41fb70bf5eed38b59ac3  .packager/tebako-shim" \
            | shasum -a 256 -c -
          chmod +x .packager/tebako .packager/tebako-shim
          .packager/tebako --help > /dev/null
      - name: Publish payloads + registry
        # tebako publish: artifacts + registry upsert + clean-cache verify
        # (the publisher home carries the dep registries for the closure proof)
        run: |
          set -euo pipefail
          "$TEBAKO_CLI" add-registry tfs:github:tebako-packages/inkscape
          "$TEBAKO_CLI" add-registry tfs:github:tebako-packages/openjdk
          "$TEBAKO_CLI" publish --name metanorma \
            --release "tfs:github:tebako-packages/metanorma:${{ github.ref_name }}" \
            --payload aarch64-macos="out/aarch64-macos/metanorma-1.16.9-macos-arm64.tfs" \
            --payload x86_64-linux-gnu="out/x86_64-linux-gnu/metanorma-1.16.9-linux-gnu-x86_64.tfs" \
            --registry-out "$PWD/tpkg-registry.yaml"
      # main is branch-protected (and the GitHub-Actions bypass is not
      # available on this plan): the registry lands by bot PR + auto-merge,
      # never by direct push. Idempotent across re-runs of the same tag.
      - name: Publish the registry entry via pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "tebako-ci"
          git config user.email "tebako@ribose.com"
          git fetch origin main
          if git diff --quiet origin/main -- tpkg-registry.yaml; then
            echo "registry unchanged (or the entry already landed on main)"
            exit 0
          fi
          branch="publish/${{ github.ref_name }}-registry"
          git checkout -b "$branch"
          git add tpkg-registry.yaml
          git commit -m "publish ${{ github.ref_name }}: registry entry (macos-arm64, linux-gnu-x86_64)"
          git push origin "$branch"
          if ! gh pr view "$branch" >/dev/null 2>&1; then
            gh pr create --base main --head "$branch" \
              --title "publish ${{ github.ref_name }}: registry entry" \
              --body "Automated registry entry for ${{ github.ref_name }} (the build-payload publish job; main is protected, so the registry lands by PR)."
          fi
          gh pr merge --auto --squash "$branch" || gh pr merge --squash "$branch"
