    - {name: cabriolet, path: /bin/cabriolet, args_default: [], active: false, runtime_requirement: {engine: ruby, constraint: "~> 3.3.0", abi: "@@ABI@@"}}
    - {name: console, path: /bin/console, args_default: [], active: false, runtime_requirement: {engine: ruby, constraint: "~> 3.3.0", abi: "@@ABI@@"}}
    - {name: convert2oscalyaml.rb, path: /bin/convert2oscalyaml.rb, args_default: [], active: false, runtime_requirement: {engine: ruby, constraint: "~> 3.3.0", abi: "@@ABI@@"}}
    - {name: dot2ruby, path: /bin/dot2ruby, args_default: [], active: false, runtime_requirement: {engine: ruby, constraint: "~> 3.3.0", abi: "@@ABI@@"}}
    - {name: ea, path: /bin/ea, args_default: [], active: false, runtime_requirement: {engine: ruby, constraint: "~> 3.3.0", abi: "@@ABI@@"}}
    - {name: ebnf, path: /bin/ebnf, args_default: [], active: false, runtime_requirement: {engine: ruby, constraint: "~> 3.3.0", abi: "@@ABI@@"}}
    - {name: emf, path: /bin/emf, args_default: [], active: false, runtime_requirement: {engine: ruby, constraint: "~> 3.3.0", abi: "@@ABI@@"}}
    - {name: emfsvg, path: /bin/emfsvg, args_default: [], active: false, runtime_requirement: {engine: ruby, constraint: "~> 3.3.0", abi: "@@ABI@@"}}
    - {name: excavate, path: /bin/excavate, args_default: [], active: false, runtime_requirement: {engine: ruby, constraint: "~> 3.3.0", abi: "@@ABI@@"}}
