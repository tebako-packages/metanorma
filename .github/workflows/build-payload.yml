        ruby_line: ["4.0", "3.3"]   # the keys of Tebakofile build.runtime.lines
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.changes.outputs.registry_only != 'true'

      - name: Read the toolchain pins (Tebakofile is the SSOT)
        if: needs.changes.outputs.registry_only != 'true'
        run: ruby tools/pins.rb linux-musl-arm64 --ruby-line "${{ matrix.ruby_line }}" --env >> "$GITHUB_ENV"

      - name: Fetch tebako CLI tools (pinned by Tebakofile, sha256-verified)
        if: needs.changes.outputs.registry_only != 'true'
        # Same pins discipline as the gnu leg (the digests are
        # cross-checked against the release's SHA256SUMS). No PATH export:
        # the binaries are dynamic-musl (they run only inside the
        # container, which gets them bind-mounted at /tebako-tools).
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/tebako-tools" && cd "$RUNNER_TEMP/tebako-tools"
          base="https://github.com/tamatebako/tebako/releases/download/$TEBAKO_RELEASE"
          curl -sLO "$base/$TEBAKO_ASSET"
          curl -sLO "$base/$TFS_ASSET"
          curl -sLO "$base/SHA256SUMS"
          echo "$TEBAKO_SHA256  $TEBAKO_ASSET" > SHA256PINS
          echo "$TFS_SHA256  $TFS_ASSET" >> SHA256PINS
          sha256sum -c SHA256PINS
          # The pins must agree with the release's own sums (both anchored).
          for pair in "$TEBAKO_ASSET:$TEBAKO_SHA256" "$TFS_ASSET:$TFS_SHA256"; do
            asset="${pair%%:*}"; want="${pair##*:}"
            got=$(awk -v a="$asset" '$2 == a {print $1}' SHA256SUMS)
            [ "$got" = "$want" ] || { echo "::error::pin mismatch for $asset: Tebakofile=$want release=${got:-ABSENT}"; exit 1; }
          done
          chmod 755 "$TEBAKO_ASSET" "$TFS_ASSET"
          mv "$TEBAKO_ASSET" tebako
          mv "$TFS_ASSET" tfs

      - name: Build the payload (in the alpine:3.21 container)
        if: needs.changes.outputs.registry_only != 'true'
        env:
          TRIPLET: aarch64-linux-musl
          RUBY_LINE: ${{ matrix.ruby_line }}
        run: |
          set -euo pipefail
          docker run --rm -i \
            -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" \
            -v "$RUNNER_TEMP/tebako-tools:/tebako-tools:ro" \
            -w "$GITHUB_WORKSPACE" \
            -e GITHUB_WORKSPACE -e TRIPLET -e RUBY_LINE \
            -e TEBAKO_CLI=/tebako-tools/tebako \
            -e TFS_CLI=/tebako-tools/tfs \
            -e SSL_CERT_FILE=/etc/ssl/certs/ca-certificates.crt \
            alpine:3.21 sh -s <<'ALPINE'
          set -e
          # Same throwaway toolchain as the x86_64 musl leg (see its
          # comment): bash, ruby (recipe/manifest reads), git (the
          # embedded-manifest commit stamp + safe.directory for the
          # bind-mounted checkout), build-base (SDK configure replay +
          # the six source-built natives), clang (the musl runtime's
          # rbconfig records CC=clang + clang-only CFLAGS — mkmf probes
          # must not fall back to gcc).
          apk add -q --no-cache bash curl git ruby build-base clang ca-certificates
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          exec bash tools/build
          ALPINE

      - name: Boot-smoke (in the alpine:3.21 container)
        if: needs.changes.outputs.registry_only != 'true'
        # Hard gate, same contract as the x86_64 musl leg (the runtime
        # exe is dynamic-musl — it execs only in the container).
        env:
          RUBY_LINE: ${{ matrix.ruby_line }}
        run: |
          set -euo pipefail
          docker run --rm -i \
            -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" \
            -v "$RUNNER_TEMP/tebako-tools:/tebako-tools:ro" \
            -w "$GITHUB_WORKSPACE" \
            -e RUBY_LINE -e RUBY_V \
            alpine:3.21 sh -s <<'ALPINE'
          set -e
          apk add -q --no-cache bash ruby
          . out/aarch64-linux-musl/runtime.env
          TFS=/tebako-tools/tfs RUNTIME="$RUNTIME" RUNTIME_IMAGE="$RUNTIME_IMAGE" \
            bash tools/boot_smoke "$PAYLOAD_IMG"
          ALPINE

      - name: Payload checks (the press-time moment; in the alpine:3.21 container)
        if: needs.changes.outputs.registry_only != 'true'
        # Same gate as the x86_64 musl leg (git + ca-certificates ride
        # along for the html-xml check's fontist invocation).
        env:
          RUBY_LINE: ${{ matrix.ruby_line }}
        run: |
          set -euo pipefail
          docker run --rm -i \
            -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" \
            -v "$RUNNER_TEMP/tebako-tools:/tebako-tools:ro" \
            -w "$GITHUB_WORKSPACE" \
            -e RUBY_LINE \
            alpine:3.21 sh -s <<'ALPINE'
          set -e
          apk add -q --no-cache git ca-certificates
          . out/aarch64-linux-musl/runtime.env
          /tebako-tools/tebako check "$PAYLOAD_IMG" \
            --runtime "$RUNTIME" --runtime-image "$RUNTIME_IMAGE"
          ALPINE

      - name: Manifest shape (extension slices; in the alpine:3.21 container)
        if: needs.changes.outputs.registry_only != 'true'
        # Same structural proof as the x86_64 musl leg (sibling +
        # embedded manifest, closure/manifest gem-count parity).
        run: |
          set -euo pipefail
          docker run --rm -i \
            -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" \
            -v "$RUNNER_TEMP/tebako-tools:/tebako-tools:ro" \
            -w "$GITHUB_WORKSPACE" \
            alpine:3.21 sh -s <<'ALPINE'
          set -e
          apk add -q --no-cache ruby
          . out/aarch64-linux-musl/runtime.env
          /tebako-tools/tfs cat "$PAYLOAD_IMG" /__tpkg__/manifest.yaml > embedded-manifest.yaml
          ruby -ryaml -rjson -e '
            man = Dir["out/*/metanorma-*.manifest.yaml"].first or abort("no sibling manifest")
            sibling = YAML.load_file(man)
            embedded = YAML.load_file("embedded-manifest.yaml")
            { "sibling" => sibling, "embedded" => embedded }.each do |label, m|
              ep = m.dig("provides", "extension_points") or abort("#{label}: provides.extension_points missing")
              ep == [{ "name" => "flavors", "mount" => "/flavors.d", "layout" => "gem-home" }] or abort("#{label}: extension_points drift: #{ep.inspect}")
              gems = m.dig("provides", "gems") or abort("#{label}: provides.gems missing")
              gems.length > 200 or abort("#{label}: gem inventory suspiciously small: #{gems.length} (1.17.0 carries ~270)")
            end
            gems = sibling.dig("provides", "gems")
            embedded.dig("provides", "gems") == gems or abort("sibling/embedded gem inventory skew")
            clo = Dir["out/*/closure-*.json"].first or abort("no closure asset")
            c = JSON.parse(File.read(clo))
            c["gems"].length == gems.length or abort("closure/manifest count skew: #{c["gems"].length} vs #{gems.length}")
            puts "manifest shape OK (sibling+embedded): #{gems.length} gems, extension point /flavors.d, closure #{File.basename(clo)}"
          '
          ALPINE

      - name: Stage artifact
        if: needs.changes.outputs.registry_only != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-aarch64-linux-musl-${{ matrix.ruby_line }}
          path: out/aarch64-linux-musl/

  release:
    name: publish
    # tebako#686 follow-on (same mechanism as the legs' heads): a plain
    # boolean here gets an implicit success() prepended, and the skip of
    # the PR-only changes job stays sticky through the green legs — the
    # job skipped on the 1.17.0-4 tag with all fourteen legs success.
    # Naming a status function keeps the tag gate without inheriting it.
    if: ${{ !cancelled() && startsWith(github.ref, 'refs/tags/') }}
    # All seven legs publish: the windows boot-smoke + html-xml gate
    # proved green on the 0.16.6 line (PR #22, head 37396c0 — the
    # tebako#437 SSL_CERT_FILE workaround), so the wiring (needs +
    # --payload + the registry entry) includes the windows artifact, and
    # the 1.17.0-4 line adds x86_64-macos / aarch64-linux-gnu /
    # x86_64-linux-musl / aarch64-linux-musl on the same green-leg gate.
    # Each leg is a 2-leg matrix (one per ruby line) — needs
    # waits for all fourteen; the publish step below upserts one registry
    # version entry per line into the SAME registry file.
    needs: [build, build-mac-intel, build-linux, build-linux-arm, build-linux-musl, build-linux-musl-arm, build-windows]
    runs-on: macos-14
    env:
      TEBAKO_CLI: ${{ github.workspace }}/.packager/tebako
      TEBAKO_HOME: ${{ github.workspace }}/.tebako
      TEBAKO_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      # The checkout rides the CI PAT so the registry bot branch's push
      # is the PAT's doing as well (tebako#686 — the publish step below).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.TEBAKO_CI_PAT_TOKEN || secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: dist-*
          path: out
          merge-multiple: false
      - name: Restore layout
        # each dist-<triplet>-<ruby_line> artifact carries the leg's
        # out/<triplet>/ contents; put them back at out/<triplet>-<line>/
        # for the per-line publish below
        run: |
          set -e
          for d in out/dist-*/; do
            p="${d#out/dist-}"; p="${p%/}"
            mkdir -p "out/$p"
            mv "$d"* "out/$p/"
            rmdir "$d"
          done
      # The publisher is the product repo's published CLI (releases are
      # the interface), pinned by Tebakofile's tools block — never a
      # from-source build, no literals in this workflow.
      - name: Read the toolchain pins (Tebakofile is the SSOT)
        run: ruby tools/pins.rb macos-arm64 --env >> "$GITHUB_ENV"
      - name: Fetch the publisher (pinned by Tebakofile, sha256-verified)
        run: |
          set -euo pipefail
          mkdir -p .packager
          curl -sL --fail -o .packager/tebako \
            "https://github.com/tamatebako/tebako/releases/download/$TEBAKO_RELEASE/$TEBAKO_ASSET"
          curl -sL --fail -o .packager/tebako-shim \
            "https://github.com/tamatebako/tebako/releases/download/$TEBAKO_RELEASE/$SHIM_ASSET"
          echo "$TEBAKO_SHA256  .packager/tebako" \
            | shasum -a 256 -c -
          echo "$SHIM_SHA256  .packager/tebako-shim" \
            | shasum -a 256 -c -
          chmod +x .packager/tebako .packager/tebako-shim
          .packager/tebako --help > /dev/null
      - name: Stage the spawned-runtime mirror (java + python legs)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # spec 32: the publish verify's clean-cache install now resolves
        # TWO spawned runtime edges — the kind: runtime java edge AND the
        # xml2rfc executable edge's nested python runtime. The mirror is
        # one base for ALL engines, so the bare JAVA_RELEASES_BASE env can
        # no longer serve both: stage a COMBINED local mirror carrying the
        # macos-arm64 leg of each pinned line (the verify host is this
        # job's macos-14 runner), every byte cross-checked against the
        # release's own SHA256SUMS (the same trust-anchor role as the
        # toolchain fetch above).
        run: |
          set -euo pipefail
          mirror=out/publish-mirror
          mkdir -p "$mirror/v$JAVA_TEBAKO" "$mirror/v$PYTHON_TEBAKO"
          # Both spawned-runtime factories publish the shard model now
          # (per-stem manifest shards + per-asset .sha256 sidecars; the
          # monolithic manifest.json / SHA256SUMS.txt are gone): stage +
          # verify + derive the trimmed index via the shared tool — the
          # pin's exact version plus its variant suffixes on this job's
          # verify host (macos-arm64). A partial mirror must not
          # advertise bytes it does not carry: the graalvm sibling's
          # version (25.x) outranks the temurin pin (21.x) on the
          # payload's wide constraint — the resolver's newest-satisfying
          # pick would name files this mirror never staged (the 2.7.0
          # dogfood 404).
          tools/stage_spawned_mirror "$mirror/v$JAVA_TEBAKO" \
            "$JAVA_RELEASES_BASE" "$JAVA_TEBAKO" "$JAVA_VERSION" macos-arm64
          tools/stage_spawned_mirror "$mirror/v$PYTHON_TEBAKO" \
            "$PYTHON_RELEASES_BASE" "$PYTHON_TEBAKO" "$PYTHON_VERSION" macos-arm64
          ls -l "$mirror/v$JAVA_TEBAKO" "$mirror/v$PYTHON_TEBAKO"
      - name: Publish payloads + registry
        # tebako publish: artifacts + registry upsert + clean-cache verify
        # (the publisher home carries the dep registries for the closure proof).
        # TEBAKO_RUNTIME_MIRROR (the combined local mirror staged above —
        # Tebakofile's java + python blocks via pins.rb) lets the verify's
        # clean-cache install resolve BOTH spawned runtime edges — neither
        # release line is the product default runtime base. Scoped to THIS
        # step: the verify never downloads the primary ruby runtime (kind:
        # language resolves at run time), so the one-base-for-all-engines
        # mirror cannot misdirect it here.
        #
        # ONE invocation per ruby line into the SAME
        # --registry-out. ORDER IS LOAD-BEARING: RUBY_LINES lists the
        # default line first and tebako-cli's upsert sets the registry
        # `default:` only when absent — the default line's entry must be
        # the first to land. Each line's PAYLOAD_VERSION (1.17.0 /
        # 1.17.0-ruby3.3) and its per-line artifact names flow from
        # tools/pins.rb --ruby-line.
        #
        # Signing (Tebakofile's signing: block; spec 09 §9): SIGNING_KEYID
        # flows from the pins step's GITHUB_ENV export; the CI signing
        # subkey arrives as org secret TEBAKO_CI_SIGNING_KEY and is staged
        # into the publisher home's keys/ below. Declared-signing + absent
        # secret fails the publish (fail-closed before any upload).
        env:
          TEBAKO_RUNTIME_MIRROR: file://${{ github.workspace }}/out/publish-mirror
          TEBAKO_SIGNING_KEY: ${{ secrets.TEBAKO_CI_SIGNING_KEY }}
        run: |
          set -euo pipefail
          # The signing key staging: with a recipe-declared signing block
          # the secret MUST be present — a signing feedstock never
          # publishes unsigned. The key file lands in the publisher home's
          # keys/ (tebako-cli resolves secret keys by keyid from
          # $TEBAKO_HOME/keys/*.key). Unsigned (no signing block) stays
          # first-class, loudly.
          SIGN_ARGS=()
          if [ -n "${SIGNING_KEYID:-}" ]; then
            : "${TEBAKO_SIGNING_KEY:?publish: recipe declares signing but TEBAKO_SIGNING_KEY is empty — a signing feedstock never publishes unsigned}"
            mkdir -p "$TEBAKO_HOME/keys"
            printf '%s\n' "$TEBAKO_SIGNING_KEY" > "$TEBAKO_HOME/keys/ci-signing.key"
            chmod 600 "$TEBAKO_HOME/keys/ci-signing.key"
            SIGN_ARGS=(--sign="$SIGNING_KEYID")
          else
            echo "::notice::recipe declares no signing — publishing unsigned (unsigned is first-class; the registry carries no signature pins)"
          fi
          # xml2rfc resolves from THIS repo's own registry (the one-stop
          # mirror — #66): no add-registry of the provider feedstock, or the
          # requires closure sees two listings and the resolver names
          # AmbiguousRegistries (exit 65).
          # The java + python runtime preferences (Tebakofile's java and
          # python blocks) — the verify's clean-cache install inherits the
          # publisher home's runtimes: prefs (tebako >= the verify-pref
          # join), and the pref-less pick would query the factory's default
          # line, which hosts no java or python. Append; the fresh runner's
          # config has none.
          # The publisher home is THIS job's TEBAKO_HOME (set at job
          # level), not $HOME/.tebako — writing anywhere else both fails
          # (the dir does not exist) and would be invisible to the verify.
          printf 'runtimes:\n  java:\n    version: "%s"\n    tebako: "%s"\n  python:\n    version: "%s"\n    tebako: "%s"\n' \
            "$JAVA_VERSION" "$JAVA_TEBAKO" "$PYTHON_VERSION" "$PYTHON_TEBAKO" >> "$TEBAKO_HOME/config.yaml"
          for ruby_line in $RUBY_LINES; do
            eval "$(ruby tools/pins.rb macos-arm64 --ruby-line "$ruby_line")"
            echo "== publish ruby line $ruby_line as version $PAYLOAD_VERSION"
            # SIGN_ARGS carries --sign=<keyid> when the recipe signs; the
            # ${arr[@]+...} guard keeps the empty (unsigned) expansion
            # legal under set -u on bash 3.2 (macOS's /bin/bash).
            "$TEBAKO_CLI" publish "${SIGN_ARGS[@]+"${SIGN_ARGS[@]}"}" --name "$PKG_NAME" \
              --release "tfs:github:tebako-packages/metanorma:${{ github.ref_name }}" \
              --payload aarch64-macos="out/aarch64-macos-$ruby_line/$PKG_NAME-$PAYLOAD_VERSION-macos-arm64.tfs" \
              --payload x86_64-macos="out/x86_64-macos-$ruby_line/$PKG_NAME-$PAYLOAD_VERSION-macos-x86_64.tfs" \
              --payload x86_64-linux-gnu="out/x86_64-linux-gnu-$ruby_line/$PKG_NAME-$PAYLOAD_VERSION-linux-gnu-x86_64.tfs" \
              --payload aarch64-linux-gnu="out/aarch64-linux-gnu-$ruby_line/$PKG_NAME-$PAYLOAD_VERSION-linux-gnu-arm64.tfs" \
              --payload x86_64-linux-musl="out/x86_64-linux-musl-$ruby_line/$PKG_NAME-$PAYLOAD_VERSION-linux-musl-x86_64.tfs" \
              --payload aarch64-linux-musl="out/aarch64-linux-musl-$ruby_line/$PKG_NAME-$PAYLOAD_VERSION-linux-musl-arm64.tfs" \
              --payload x86_64-windows-ucrt="out/x86_64-windows-ucrt-$ruby_line/$PKG_NAME-$PAYLOAD_VERSION-windows-ucrt64.tfs" \
              --registry-out "$PWD/tpkg-registry.yaml"
          done
          # The spawned-runtime registry entries (spec 04 §2's kind:
          # runtime, schema MINOR 1 — the resolver's channel 3): without
          # them a real-world `tebako install metanorma` (no mirror, no
          # config source pin) cannot source the java/python runtimes —
          # the wave-5 acceptance failed exactly so. The entries FLOW
          # from Tebakofile's pins (JAVA_*/PYTHON_* above — never
          # hand-duplicated), upserted by entry name with versions
          # accumulated by key (older pinned lines keep serving older
          # payload versions). tebako publish's upsert round-trips the
          # engine/implementation keys, so later publishes preserve them.
          # The release refs carry the v-prefixed tag verbatim — the
          # resolver composes {base}/{tag} from it. The implementation
          # key is load-bearing, not decoration: spec 28 §8 narrows the
          # resolver's entry scan to entries carrying the edge's named
          # implementation (the xml2rfc python edge names cpython) — an
          # entry without it is invisible to that edge (exit 69).
          # The requires-closure PAYLOAD mirror (the spec-32 executable
          # xml2rfc): a wild `tebako install metanorma` registers only
          # THIS registry, so every non-runtime requires edge must resolve
          # here too — the same channel-3 argument as the spawned runtimes
          # above (the macOS pkg seed's install failed exit 65 on exactly
          # this gap). The entry is copied WHOLESALE (platforms + digests
          # + signature + release.ref) from the provider registry — the
          # provider registry is the SSOT, this is the L3 mirror by value,
          # replaced by entry name at every render (here AND in the
          # scheduled refresh-mirrors workflow).
          curl -fsSL -o "$RUNNER_TEMP/registry-xml2rfc.yaml" \
            https://raw.githubusercontent.com/tebako-packages/xml2rfc/main/tpkg-registry.yaml
          # The render lives in tools/refresh_mirrors.rb — the SAME tool
          # the refresh-mirrors workflow runs between publishes, so this
          # job and that workflow can never diverge (the 2026-09-29
          # staleness class).
          ruby tools/refresh_mirrors.rb \
            "$RUNNER_TEMP/registry-xml2rfc.yaml"
      # The extension-slice dedup source (spec 03 §2.8): each leg's build
      # generated closure-<version>-<platform>.json (the staged gem
      # inventory) into its dist artifact; flavor feedstocks fetch the
      # pinned base release's asset and subtract it at slice press, and
      # the slice manifest records its sha256 as
      # augments[].built_against.closure_sha256.
      - name: Attach the closure inventories
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Skip-if-current (tebako-runtime-ruby#189's wedge lesson): the
          # closure inventories are DERIVED metadata — replace on drift,
          # skip when already current, never a blanket --clobber (a
          # deleted name 422-blocks re-uploads for hours).
          for f in out/*/closure-*.json; do
            name="$(basename "$f")"
            want="$(shasum -a 256 "$f" | cut -d' ' -f1)"
            have="$(gh api "repos/tebako-packages/metanorma/releases/tags/${{ github.ref_name }}" \
              --jq ".assets[] | select(.name == \"$name\") | .digest" | sed 's/^sha256://')"
            if [ "$have" = "$want" ]; then
              echo "$name is already current on the release — skipping"
            else
              gh release upload "${{ github.ref_name }}" "$f" --clobber
            fi
          done
      # main is branch-protected (and the GitHub-Actions bypass is not
      # available on this plan): the registry lands by bot PR + auto-merge,
      # never by direct push. Idempotent across re-runs of the same tag.
      - name: Publish the registry entry via pull request
        env:
          # The CI PAT authors the PR: a GITHUB_TOKEN-authored PR's checks
          # sit on the approval queue until they expire red. tebako#686:
          # the legs' registry-only step guards (job heads above) make the
          # PAT-authored PR's pinned leg checks report green WITHOUT a
          # build — before them the full matrix ran tag-less here and
          # fast-failed, so auto-merge never fired.
          GH_TOKEN: ${{ secrets.TEBAKO_CI_PAT_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "tebako-ci"
          git config user.email "tebako@ribose.com"
          git fetch origin main
          if git diff --quiet origin/main -- tpkg-registry.yaml; then
            echo "registry unchanged (or the entry already landed on main)"
            exit 0
          fi
          branch="publish/${{ github.ref_name }}-registry"
          git checkout -b "$branch"
          git add tpkg-registry.yaml
          git commit -m "publish ${{ github.ref_name }}: registry entries (macos-arm64, macos-x86_64, linux-gnu-x86_64, linux-gnu-arm64, linux-musl-x86_64, linux-musl-arm64, windows-ucrt64; ruby lines: $RUBY_LINES)"
          git push origin "$branch"
          if ! gh pr view "$branch" >/dev/null 2>&1; then
            gh pr create --base main --head "$branch" \
              --title "publish ${{ github.ref_name }}: registry entry" \
              --body "Automated registry entry for ${{ github.ref_name }} (the build-payload publish job; main is protected, so the registry lands by PR)."
          fi
          gh pr merge --auto --squash "$branch" || gh pr merge --squash "$branch"

  # Immediacy dispatch (spec 04 §2's freshness): on tags, after the
  # publish job lands, poke the official aggregate so its regeneration
  # does not wait for the 6-hourly schedule. The reusable workflow waits
  # for THIS repo's registry PR to hit main first, then fires
  # repository_dispatch: feedstock-published on tebako-packages/registry.
  # Never fatal — the aggregate's schedule is the backstop.
  ping-registry:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [release]
    uses: tebako-packages/registry/.github/workflows/ping-aggregate.yml@main
    secrets: inherit
