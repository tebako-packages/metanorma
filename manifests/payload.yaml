  platforms: [aarch64-macos]
  capabilities: {exec: true, read: true}
requires:
  - kind: language
    engine: ruby
    constraint: "@@CONSTRAINT@@"
  # metanorma's graphics chain (spec 03 §2.3 DEPENDS): isodoc rasterizes SVG
  # figures through vectory -> inkscape for doc/html output. The dispatcher
  # mounts the inkscape toolkit payload at the consumer-declared point.
  - kind: toolkit
    name: inkscape
    constraint: ">= 1.3"
    mount: /opt/inkscape
  # the hermetic java answer (jing + mn2pdf): the openjdk RUNTIME
  # (kind: runtime, spec 30) — the JVM runs as a spawned child process
  # dispatched through tebako from the store, never co-mounted, never a
  # host-PATH fallback. `expose: [java]` is the spawn surface: the
  # payload's `java …` spawns rewrite to a full dispatch of the depended
  # runtime's wrapper exe; an undeclared command name is never rewritten.
  # The constraint is a RANGE, not a pin: jing and FOP are Java-8+
  # consumers, so any current LTS satisfies; the upper bound is the
  # honesty line — a future major we have not validated is a named
  # resolution miss, never a silent pick. `implementation: temurin`
  # (spec 28 §8) narrows the engine axis to the validated flavor:
  # the v2.5.1 openjdk manifest lists a graalvm sibling (25.0.4.1)
  # whose version outranks 21.0.12 — without the axis the newest
  # pick would silently land the unvalidated flavor.
  - kind: runtime
    engine: java
    implementation: temurin
    constraint: ">= 21, < 26"
    expose: [java]
  # the ietf output chain (spec 32 — the FIRST kind: executable spawn
  # edge): metanorma-ietf/mn2rfc shells out to the `xml2rfc` console
  # script for the rfc text/html renderings. xml2rfc is a python app —
  # an interpreter-needing console script has no co-mountable exec form
  # (spec 32 §0), so the edge opens the SPAWN surface only: the
  # provider payload dispatches as a child through its own full spec-17
  # dispatch (its kind: language edge resolving the python runtime
  # pair), the parent's in-VFS .xml carried by the spec 30 §2
  # re-mount/materialize rule. `payload: xml2rfc` pins the provider by
  # name (the §8 AmbiguousProvider escape hatch — the capability name
  # IS the payload name here, pinned for explicitness); the press
  # cross-check validates it against the provider's L1. This retires
  # the host-python xml2rfc convention (PROGRESS/25 — the chocolatey
  # python313/1603 saga): an undeclared `xml2rfc` on the host PATH is
  # never a fallback. critical: the ietf document class cannot render
  # without the edge, so a schema_minor < 5 reader must refuse, not
  # skip (the evolution law).
  - kind: executable
    name: xml2rfc
    payload: xml2rfc
    constraint: ">= 3.34"
    expose: [xml2rfc]
    critical: true
# The payload's in-image acceptance (spec 26 §1) — the Homebrew formula's
# test block translated. Press-time moment (§3): build-payload.yml runs
# `tebako check` against the just-imaged slice per leg; the engine reads
# this block from /__tpkg__/manifest.yaml. fixtures images at
# /__tpkg__/check/html-xml/ (tools/build), contents land at the engine's
# scratch root; expect.files are scratch-relative, existence + non-empty
# (byte-goldens forbidden — §1). No pdf level here: it needs the jvm
# capability, which the bare-image press-time composition never provides.
checks:
  html-xml:
    entry: /bin/metanorma
    argv: ["--type", "iso", "{scratch}/test-iso.adoc", "--agree-to-terms"]
    fixtures: /__tpkg__/check/html-xml
    expect: { exit: 0, files: ["test-iso.xml", "test-iso.html"] }
    # Cold fontist is silent (metanorma passes no_progress) and slow: the
    # formulas-repo git clone + the ISO font-set downloads + the system
    # index build all happen inside this compile. Round-2 CI evidence (run
    # 32538413907): both POSIX legs sat in that phase for 173s+ of total
    # silence and died at 180; the dogfood run (warm-path equivalent on the
    # same runner class) cleared it in ~58s — cold CI egress lands between.
    # 600 is the generous bound; the PASS verdict line prints the measured
    # elapsed (`check html-xml PASS <n>s`), so tighten to measured+headroom
    # once a green run reports the real number.
    timeout: 600
  # The bundled-CLI smokes — spec 03 §2.2 completeness made executable:
  # the generic stub (templates/bin/command staged at /bin/<name>) derives
  # its identity from its filename, resolves the owning gem via
  # Gem::Specification, and boots the CLI. No fixtures — a bare --help;
  # exit 0 is the whole assertion. fontist and suma stand for the set
  # (thor-based and plain-startup respectively).
  fontist-cli:
    entry: /bin/fontist
    argv: ["--help"]
    expect: { exit: 0 }
  suma-cli:
    entry: /bin/suma
    argv: ["--help"]
    expect: { exit: 0 }
