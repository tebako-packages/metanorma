        # Same pins discipline as the gnu leg (the digests are
        # cross-checked against the release's SHA256SUMS). No PATH export:
        # the binaries are dynamic-musl (they run only inside the
        # container, which gets them bind-mounted at /tebako-tools).
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/tebako-tools" && cd "$RUNNER_TEMP/tebako-tools"
          base="https://github.com/tamatebako/tebako/releases/download/$TEBAKO_RELEASE"
          curl -sLO "$base/$TEBAKO_ASSET"
          curl -sLO "$base/$TFS_ASSET"
          curl -sLO "$base/SHA256SUMS"
          echo "$TEBAKO_SHA256  $TEBAKO_ASSET" > SHA256PINS
          echo "$TFS_SHA256  $TFS_ASSET" >> SHA256PINS
          sha256sum -c SHA256PINS
