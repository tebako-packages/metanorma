    # runtime, the musl tebako/tfs tools, and the CLI-provisioned SDK all
    # resolve by the leg's own platform pins, so nothing in tools/build is
    # musl-aware. The throwaway container installs its own toolchain per
    # step (busybox ash prelude — POSIX only).
    runs-on: ubuntu-24.04
