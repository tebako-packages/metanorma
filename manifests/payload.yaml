    - {name: thor, path: /bin/thor, args_default: [], active: false, runtime_requirement: {engine: ruby, constraint: "~> 3.3.0", abi: "@@ABI@@"}}
    - {name: tokenize, path: /bin/tokenize, args_default: [], active: false, runtime_requirement: {engine: ruby, constraint: "~> 3.3.0", abi: "@@ABI@@"}}
