    # leg must run and report green, building nothing).
    # The musl shape (the product repo's musl pattern — tebako's
    # release.yml linux-musl leg): node actions cannot run on musl, so
    # checkout / pins / tool-fetch / upload stay on the gnu host and every
    # build/smoke/check step runs inside alpine:3.21 via docker run with
    # the workspace + the fetched tools bind-mounted at the same paths.
