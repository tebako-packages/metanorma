            [ "$got" = "$want" ] || { echo "::error::pin mismatch for $asset: Tebakofile=$want release=${got:-ABSENT}"; exit 1; }
          done
          chmod 755 "$TEBAKO_ASSET" "$TFS_ASSET"
          mv "$TEBAKO_ASSET" tebako
          mv "$TFS_ASSET" tfs

      - name: Build the payload (in the alpine:3.21 container)
        if: needs.changes.outputs.registry_only != 'true'
        env:
          TRIPLET: x86_64-linux-musl
          RUBY_LINE: ${{ matrix.ruby_line }}
        run: |
          set -euo pipefail
          docker run --rm -i \
            -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" \
            -v "$RUNNER_TEMP/tebako-tools:/tebako-tools:ro" \
            -w "$GITHUB_WORKSPACE" \
            -e GITHUB_WORKSPACE -e TRIPLET -e RUBY_LINE \
            -e TEBAKO_CLI=/tebako-tools/tebako \
            -e TFS_CLI=/tebako-tools/tfs \
            -e SSL_CERT_FILE=/etc/ssl/certs/ca-certificates.crt \
            alpine:3.21 sh -s <<'ALPINE'
