name: build-payload
# Feedstock build: recipe → per-triplet legs → boot-smoke → release.
# Conventions: docs/conventions.md in tebako-packages/index.
#
# STATUS:
#   aarch64-macos — green: build + boot smoke; tags publish.
#   x86_64-linux-gnu — build + boot smoke (ubuntu-24.04, the POSIX shim
#   staging — same shape as the mac leg; the five precompiled natives are
#   the glibc-x86_64 variants); tags publish together with the mac leg.
#   x86_64-windows-ucrt — build + boot smoke ENFORCED: the 0.16.x runtime
#   line carries the windows runtime-layer fixes the exec gate waited on
#   (the ruby DLL facet + the loader interpose / library_aliases — spec 22
#   phase W2; re-cut green as tebako-runtime-ruby run 32346716268), so
#   tools/smoke_verdict runs enforcing: ANY boot-smoke failure fails the
#   leg. The gate proved green (PR #22, incl. the html-xml check with
#   the tebako#437 CA-bundle workaround); tags publish the windows
#   artifact together with the mac + linux legs (docs/build-notes.md § Windows).
#   ALL legs — the spec-26 press-time gate: after boot smoke, each leg
#   runs `tebako check` (the v0.3.1 CLI) against the just-imaged slice +
#   the pinned runtime — the payload's in-image acceptance (the Homebrew
#   formula's test translated; manifests/payload.yaml `checks:`). FAIL is
#   the engine's named exit 79.
on:
  push:
    branches: [main]
    tags: ["*"]
  pull_request:
  workflow_dispatch:

# One run per branch/PR-head at a time: pushing to a branch with an open
# PR would otherwise run every job twice (push + pull_request events);
# a new run cancels the stale one.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  build:
    name: aarch64-macos
    runs-on: macos-14
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read the toolchain pins (recipe.yml is the SSOT)
        run: ruby tools/pins.rb macos-arm64 --env >> "$GITHUB_ENV"

      - name: Fetch tebako CLI tools (pinned by recipe.yml, sha256-verified)
        # The packager is the RELEASE BINARY (releases are the
        # interface); every version/digest flows from recipe.yml's tools
        # block via tools/pins.rb — this workflow carries NO literals —
        # and the pins are cross-checked against the release's SHA256SUMS
        # (provenance: docs/build-notes.md). The v0.1.9 floor stays true:
        # the 0.16.x runtime env images are gem-less (spec 22 M2) —
        # earlier CLIs gate the press on the retired tebako-runtime gem
        # (exit 129).
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/tebako-tools" && cd "$RUNNER_TEMP/tebako-tools"
          base="https://github.com/tamatebako/tebako/releases/download/$TEBAKO_RELEASE"
          curl -sLO "$base/$TEBAKO_ASSET"
          curl -sLO "$base/$TFS_ASSET"
          curl -sLO "$base/SHA256SUMS"
          echo "$TEBAKO_SHA256  $TEBAKO_ASSET" > SHA256PINS
          echo "$TFS_SHA256  $TFS_ASSET" >> SHA256PINS
          shasum -a 256 -c SHA256PINS
          # The pins must agree with the release's own sums (both anchored).
          for pair in "$TEBAKO_ASSET:$TEBAKO_SHA256" "$TFS_ASSET:$TFS_SHA256"; do
            asset="${pair%%:*}"; want="${pair##*:}"
            got=$(awk -v a="$asset" '$2 == a {print $1}' SHA256SUMS)
            [ "$got" = "$want" ] || { echo "::error::pin mismatch for $asset: recipe.yml=$want release=${got:-ABSENT}"; exit 1; }
          done
          chmod 755 "$TEBAKO_ASSET" "$TFS_ASSET"
          mv "$TEBAKO_ASSET" tebako
          mv "$TFS_ASSET" tfs
          echo "$RUNNER_TEMP/tebako-tools" >> "$GITHUB_PATH"

      - name: Build the payload
        env:
          TEBAKO_CLI: tebako
          TFS_CLI: tfs
        run: tools/build

      - name: Boot-smoke
        # Hard rule (docs/conventions.md): the packaged tool's version
        # command runs from the image before any release publishes.
        env:
          TFS: tfs
        run: |
          . out/aarch64-macos/runtime.env
          TFS="$TFS" RUNTIME="$RUNTIME" RUNTIME_IMAGE="$RUNTIME_IMAGE" \
            tools/boot_smoke "$PAYLOAD_IMG"

      - name: Payload checks (spec 26 — the press-time moment)
        # The payload's in-image acceptance, the Homebrew formula's test
        # translated (manifests/payload.yaml `checks:` block, imaged at
        # /__tpkg__/manifest.yaml): the engine materializes the fixtures
        # at a scratch root, runs the entrypoint, asserts exit 0 +
        # test-iso.xml/.html non-empty. FAIL → exit 79 (named); a check
        # with unmet prerequisites SKIPs loudly without failing the leg.
        # PAYLOAD_IMG out of runtime.env: tools/build's absolute spelling —
        # the check driver runs with cwd = the scratch dir, so a relative
        # image path dies "cannot open image file" (os error 2).
        run: |
          . out/aarch64-macos/runtime.env
          tebako check "$PAYLOAD_IMG" \
            --runtime "$RUNTIME" --runtime-image "$RUNTIME_IMAGE"

      - name: Stage artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-aarch64-macos
          path: out/aarch64-macos/

  build-windows:
    name: x86_64-windows-ucrt
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up MSYS2 (ucrt64 toolchain for the ruby SDK + the six natives)
        # gcc-libs rides along for the msys2 toolchain's own binaries;
        # the v0.3.1 tebako windows binaries are statically linked (the
        # release's ship gate audits PE imports).
        # zlib: the explicit source of the zlib1.dll that
        # tools/vendor_siblings.rb vendors next to the payload's
        # libpng16.dll — pinned here, never relied on as a transitive dep.
        # git: the spec-26 check's compile hits fontist's cold formulas-repo
        # update, which spawns `git` (fontist 3.0.10 update.rb -> Git.clone).
        # POSIX runners carry git on PATH natively; path-type: minimal does
        # not — the round-2 windows leg died there (Errno::ENOENT, run
        # 32538413907). Not a spec-23 `needs:`: a declaration cannot conjure
        # an absent binary, and the POSIX legs prove host-git exec under the
        # check policy needs none.
        uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884 # v2.32.0
        with:
          msystem: ucrt64
          path-type: minimal
          install: >-
            make
            patch
            tar
            curl
            git
            ruby
            mingw-w64-ucrt-x86_64-toolchain
            mingw-w64-ucrt-x86_64-gcc-libs
            mingw-w64-ucrt-x86_64-zlib

      - name: Read the toolchain pins (recipe.yml is the SSOT)
        shell: msys2 {0}
        run: ruby tools/pins.rb windows-ucrt64 --env >> "$GITHUB_ENV"

      - name: Fetch tebako CLI tools (pinned by recipe.yml, sha256-verified)
        # the matrix context is not available to step-level `shell`, so
        # the windows leg gets its own steps with the literal msys2 keyword
        shell: msys2 {0}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/tebako-tools" && cd "$RUNNER_TEMP/tebako-tools"
          base="https://github.com/tamatebako/tebako/releases/download/$TEBAKO_RELEASE"
          curl -sLO "$base/$TEBAKO_ASSET"
          curl -sLO "$base/$TFS_ASSET"
          curl -sLO "$base/SHA256SUMS"
          echo "$TEBAKO_SHA256  $TEBAKO_ASSET" > SHA256PINS
          echo "$TFS_SHA256  $TFS_ASSET" >> SHA256PINS
          sha256sum -c SHA256PINS
          # The pins must agree with the release's own sums (both anchored).
          for pair in "$TEBAKO_ASSET:$TEBAKO_SHA256" "$TFS_ASSET:$TFS_SHA256"; do
            asset="${pair%%:*}"; want="${pair##*:}"
            got=$(awk -v a="$asset" '$2 == a {print $1}' SHA256SUMS)
            [ "$got" = "$want" ] || { echo "::error::pin mismatch for $asset: recipe.yml=$want release=${got:-ABSENT}"; exit 1; }
          done
          cp "$TEBAKO_ASSET" tebako.exe
          cp "$TFS_ASSET" tfs.exe
          echo "TEBAKO_TOOLS=$(cygpath -m "$RUNNER_TEMP/tebako-tools")" >> "$GITHUB_ENV"

      - name: Build the payload
        shell: msys2 {0}
        env:
          TRIPLET: x86_64-windows-ucrt
        run: |
          export TEBAKO_CLI="$TEBAKO_TOOLS/tebako.exe"
          export TFS_CLI="$TEBAKO_TOOLS/tfs.exe"
          tools/build

      - name: Boot-smoke + verdict
        # Fully enforcing (header comment): on the 0.16.x runtime line the
        # exec leg must PASS — tools/smoke_verdict fails the leg on ANY
        # nonzero rc, classifying the old LoadError signature as a named
        # runtime regression vs. an undiagnosed failure.
        shell: msys2 {0}
        run: |
          . out/x86_64-windows-ucrt/runtime.env
          set +e
          TFS="$TEBAKO_TOOLS/tfs.exe" RUNTIME="$RUNTIME" RUNTIME_IMAGE="$RUNTIME_IMAGE" \
            tools/boot_smoke "$PAYLOAD_IMG" \
            2>&1 | tee "$RUNNER_TEMP/smoke.log"
          rc=${PIPESTATUS[0]}
          set -e
          tools/smoke_verdict "$rc" "$RUNNER_TEMP/smoke.log"

      - name: Payload checks (spec 26 — the press-time moment)
        # Same gate as the POSIX legs (see the mac step's comment); FAIL
        # is the engine's named exit 79. PAYLOAD_IMG rides runtime.env
        # (windows-form absolute) — the check driver's cwd is the scratch
        # dir, a relative image path does not resolve there.
        # tebako#437 workaround: with the runtime image passed as a bare
        # path (no store sidecar) the exe shim's store-less fallback sets
        # SSL_CERT_FILE to the IN-VFS A:/t/ssl/cert.pem, which the native
        # libcrypto reads via CRT IO — the file is not on the host, so the
        # OpenSSL store comes up empty and fontist's https dies "unable to
        # get local issuer certificate". The shim honors a user-set
        # SSL_CERT_FILE ("user wins"), so extract the CA bundle from the
        # runtime image and point at the HOST copy. cygpath -w: the
        # packaged exe is a native CRT reader — an msys spelling
        # (/d/a/...) does not resolve. Graceful no-op when the image
        # carries no /ssl/cert.pem (the POSIX runtime images ship none).
        # The in-image path below is spelled SLASH-LESS ("ssl/cert.pem",
        # which tfs accepts) on purpose: under msys2 a leading-slash argv
        # element passed to a NATIVE exe is path-converted to a host path
        # ("/ssl/cert.pem" → "D:/..."), tfs then finds nothing and the
        # guard no-ops — the round-1 form of this workaround died exactly
        # there. (boot_smoke shields with MSYS2_ARG_CONV_EXCL='*' instead;
        # the slash-less spelling keeps the guard shell-agnostic.)
        shell: msys2 {0}
        run: |
          . out/x86_64-windows-ucrt/runtime.env
          if "$TEBAKO_TOOLS/tfs.exe" cat "$RUNTIME_IMAGE" ssl/cert.pem \
               > "$RUNNER_TEMP/tebako-ca-cert.pem" 2>/dev/null \
             && [ -s "$RUNNER_TEMP/tebako-ca-cert.pem" ]; then
            export SSL_CERT_FILE="$(cygpath -w "$RUNNER_TEMP/tebako-ca-cert.pem")"
            echo "SSL_CERT_FILE=$SSL_CERT_FILE (CA bundle extracted from the runtime image — tebako#437 workaround)"
          else
            echo "runtime image carries no /ssl/cert.pem — no SSL_CERT_FILE override (tebako#437 workaround no-op)"
          fi
          "$TEBAKO_TOOLS/tebako.exe" check "$PAYLOAD_IMG" \
            --runtime "$RUNTIME" --runtime-image "$RUNTIME_IMAGE"

      - name: Stage artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-x86_64-windows-ucrt
          path: out/x86_64-windows-ucrt/

  build-linux:
    name: x86_64-linux-gnu
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read the toolchain pins (recipe.yml is the SSOT)
        run: ruby tools/pins.rb linux-gnu-x86_64 --env >> "$GITHUB_ENV"

      - name: Fetch tebako CLI tools (pinned by recipe.yml, sha256-verified)
        # Same pins discipline as the mac leg (the digests are cross-checked
        # against the release's SHA256SUMS); ubuntu has sha256sum, not shasum.
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/tebako-tools" && cd "$RUNNER_TEMP/tebako-tools"
          base="https://github.com/tamatebako/tebako/releases/download/$TEBAKO_RELEASE"
          curl -sLO "$base/$TEBAKO_ASSET"
          curl -sLO "$base/$TFS_ASSET"
          curl -sLO "$base/SHA256SUMS"
          echo "$TEBAKO_SHA256  $TEBAKO_ASSET" > SHA256PINS
          echo "$TFS_SHA256  $TFS_ASSET" >> SHA256PINS
          sha256sum -c SHA256PINS
          # The pins must agree with the release's own sums (both anchored).
          for pair in "$TEBAKO_ASSET:$TEBAKO_SHA256" "$TFS_ASSET:$TFS_SHA256"; do
            asset="${pair%%:*}"; want="${pair##*:}"
            got=$(awk -v a="$asset" '$2 == a {print $1}' SHA256SUMS)
            [ "$got" = "$want" ] || { echo "::error::pin mismatch for $asset: recipe.yml=$want release=${got:-ABSENT}"; exit 1; }
          done
          chmod 755 "$TEBAKO_ASSET" "$TFS_ASSET"
          mv "$TEBAKO_ASSET" tebako
          mv "$TFS_ASSET" tfs
          echo "$RUNNER_TEMP/tebako-tools" >> "$GITHUB_PATH"

      - name: Build the payload
        env:
          TRIPLET: x86_64-linux-gnu
          TEBAKO_CLI: tebako
          TFS_CLI: tfs
        run: tools/build

      - name: Boot-smoke
        # Hard gate, same as the mac leg: the packaged tool's version
        # command runs from the image against the linux 0.16.x runtime
        # (resolved by tools/build's stub press) before any release
        # publishes.
        env:
          TFS: tfs
        run: |
          . out/x86_64-linux-gnu/runtime.env
          TFS="$TFS" RUNTIME="$RUNTIME" RUNTIME_IMAGE="$RUNTIME_IMAGE" \
            tools/boot_smoke "$PAYLOAD_IMG"

      - name: Payload checks (spec 26 — the press-time moment)
        # Same gate as the mac leg (see its comment for the contract);
        # PAYLOAD_IMG rides runtime.env (absolute — the check driver's
        # cwd is the scratch dir).
        run: |
          . out/x86_64-linux-gnu/runtime.env
          tebako check "$PAYLOAD_IMG" \
            --runtime "$RUNTIME" --runtime-image "$RUNTIME_IMAGE"

      - name: Stage artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-x86_64-linux-gnu
          path: out/x86_64-linux-gnu/

  release:
    name: publish
    if: startsWith(github.ref, 'refs/tags/')
    # All three legs publish: the windows boot-smoke + html-xml gate
    # proved green on the 0.16.6 line (PR #22, head 37396c0 — the
    # tebako#437 SSL_CERT_FILE workaround), so the wiring (needs +
    # --payload + the registry entry) now includes the windows artifact.
    needs: [build, build-linux, build-windows]
    runs-on: macos-14
    env:
      TEBAKO_CLI: ${{ github.workspace }}/.packager/tebako
      TEBAKO_HOME: ${{ github.workspace }}/.tebako
      TEBAKO_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: dist-*
          path: out
          merge-multiple: false
      - name: Restore layout
        # each dist-<triplet> artifact carries the leg's out/<triplet>/
        # contents; put them back at out/<triplet>/ for the publish below
        run: |
          set -e
          for d in out/dist-*/; do
            p="${d#out/dist-}"; p="${p%/}"
            mkdir -p "out/$p"
            mv "$d"* "out/$p/"
            rmdir "$d"
          done
      # The publisher is the product repo's published CLI (releases are
      # the interface), pinned by recipe.yml's tools block — never a
      # from-source build, no literals in this workflow.
      - name: Read the toolchain pins (recipe.yml is the SSOT)
        run: ruby tools/pins.rb macos-arm64 --env >> "$GITHUB_ENV"
      - name: Fetch the publisher (pinned by recipe.yml, sha256-verified)
        run: |
          set -euo pipefail
          mkdir -p .packager
          curl -sL --fail -o .packager/tebako \
            "https://github.com/tamatebako/tebako/releases/download/$TEBAKO_RELEASE/$TEBAKO_ASSET"
          curl -sL --fail -o .packager/tebako-shim \
            "https://github.com/tamatebako/tebako/releases/download/$TEBAKO_RELEASE/$SHIM_ASSET"
          echo "$TEBAKO_SHA256  .packager/tebako" \
            | shasum -a 256 -c -
          echo "$SHIM_SHA256  .packager/tebako-shim" \
            | shasum -a 256 -c -
          chmod +x .packager/tebako .packager/tebako-shim
          .packager/tebako --help > /dev/null
      - name: Publish payloads + registry
        # tebako publish: artifacts + registry upsert + clean-cache verify
        # (the publisher home carries the dep registries for the closure proof).
        # TEBAKO_RUNTIME_MIRROR (from recipe.yml's java block via pins.rb) lets
        # the verify's clean-cache install resolve the kind: runtime java edge
        # — the openjdk release line is NOT the product default runtime base.
        # Scoped to THIS step: the verify never downloads the primary ruby
        # runtime (kind: language resolves at run time), so the one-base-for-
        # all-engines mirror cannot misdirect it here.
        env:
          TEBAKO_RUNTIME_MIRROR: ${{ env.JAVA_RELEASES_BASE }}
        run: |
          set -euo pipefail
          "$TEBAKO_CLI" add-registry tfs:github:tebako-packages/inkscape
          # The java runtime preference (recipe.yml's java block) — the
          # verify's clean-cache install inherits the publisher home's
          # runtimes: prefs (tebako >= the verify-pref join), and the
          # pref-less pick would query the factory's default line, which
          # hosts no java. Append; the fresh runner's config has none.
          # The publisher home is THIS job's TEBAKO_HOME (set at job
          # level), not $HOME/.tebako — writing anywhere else both fails
          # (the dir does not exist) and would be invisible to the verify.
          printf 'runtimes:\n  java:\n    version: "%s"\n    tebako: "%s"\n' \
            "$JAVA_VERSION" "$JAVA_TEBAKO" >> "$TEBAKO_HOME/config.yaml"
          "$TEBAKO_CLI" publish --name "$PKG_NAME" \
            --release "tfs:github:tebako-packages/metanorma:${{ github.ref_name }}" \
            --payload aarch64-macos="out/aarch64-macos/$PKG_NAME-$PKG_VERSION-macos-arm64.tfs" \
            --payload x86_64-linux-gnu="out/x86_64-linux-gnu/$PKG_NAME-$PKG_VERSION-linux-gnu-x86_64.tfs" \
            --payload x86_64-windows-ucrt="out/x86_64-windows-ucrt/$PKG_NAME-$PKG_VERSION-windows-ucrt64.tfs" \
            --registry-out "$PWD/tpkg-registry.yaml"
      # main is branch-protected (and the GitHub-Actions bypass is not
      # available on this plan): the registry lands by bot PR + auto-merge,
      # never by direct push. Idempotent across re-runs of the same tag.
      - name: Publish the registry entry via pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "tebako-ci"
          git config user.email "tebako@ribose.com"
          git fetch origin main
          if git diff --quiet origin/main -- tpkg-registry.yaml; then
            echo "registry unchanged (or the entry already landed on main)"
            exit 0
          fi
          branch="publish/${{ github.ref_name }}-registry"
          git checkout -b "$branch"
          git add tpkg-registry.yaml
          git commit -m "publish ${{ github.ref_name }}: registry entry (macos-arm64, linux-gnu-x86_64, windows-ucrt64)"
          git push origin "$branch"
          if ! gh pr view "$branch" >/dev/null 2>&1; then
            gh pr create --base main --head "$branch" \
              --title "publish ${{ github.ref_name }}: registry entry" \
              --body "Automated registry entry for ${{ github.ref_name }} (the build-payload publish job; main is protected, so the registry lands by PR)."
          fi
          gh pr merge --auto --squash "$branch" || gh pr merge --squash "$branch"
