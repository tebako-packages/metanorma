name: dogfood
# THE dogfood (roadmap 32): a bare runner installs the tebako CLI from the
# published tamatebako/tebako release, adds the tebako-packages registries,
# installs the published metanorma payload, and runs a real compile whose
# figure goes through the inkscape toolkit payload and whose PDF leg spawns
# the openjdk RUNTIME (the kind: runtime edge, spec 30 — the JVM is a child
# process dispatched from the store, never a host-PATH lookup) — proving the
# full dispatch chain (registry -> runtime + app payload + toolkit payloads
# + spawned runtime edges -> shim exec).
#
# Legs:
#   aarch64-macos — ACTIVE (payload published: metanorma 1.16.9 macos-arm64).
#   x86_64-linux-gnu — joins when the recipe's linux leg publishes
#     (recipe.yml platforms; the build-notes expect no new machinery).
#   x86_64-windows-ucrt — joins when the windows payload publishes. The
#     native-extension question is ANSWERED: the 0.16.4 runtime line ships
#     the ruby DLL facet + the loader interpose / library_aliases (spec 22
#     phase W2) and the build-payload windows boot smoke is now ENFORCED
#     against it (tools/smoke_verdict flipped fail-closed).
on:
  schedule:
    - cron: "17 3 * * *"        # nightly
  pull_request:
    paths: [".github/workflows/dogfood.yml", "fixtures/**", "tpkg-registry.yaml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dogfood:
    name: ${{ matrix.triplet }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { triplet: aarch64-macos, os: macos-14, plat: macos-arm64 }
          - { triplet: x86_64-linux-gnu, os: ubuntu-24.04, plat: linux-gnu-x86_64 }
          # - { triplet: x86_64-windows-ucrt, os: windows-latest, plat: windows-ucrt64 } # windows payload publish first (see header)
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Every version flows from recipe.yml (tools.release +
      # upstream.version) — the workflow carries no literals.
      - name: Read the pins (recipe.yml is the SSOT)
        run: |
          ruby tools/pins.rb --release-only >> "$GITHUB_ENV"

      - name: Install the tebako CLI from the release (SHA256SUMS-verified)
        # Nothing tebako-related is on this bare runner: no runtime, no
        # payloads, no shims — the install below is the full cold path.
        # The binaries land under their BARE names (the install.sh
        # convention): the CLI locates the dispatcher next to its own
        # current_exe, which linux resolves through /proc/self/exe —
        # a version-named real file breaks that sibling lookup (exit 74).
        run: |
          set -euo pipefail
          base="https://github.com/tamatebako/tebako/releases/download/$TEBAKO_RELEASE"
          mkdir -p "$RUNNER_TEMP/tebako-bin"
          cd "$RUNNER_TEMP/tebako-bin"
          curl -sSfLO "$base/SHA256SUMS"
          for tool in tebako tebako-shim; do
            curl -sSfLO "$base/$tool-${TEBAKO_RELEASE#v}-${{ matrix.plat }}"
            grep "$tool-${TEBAKO_RELEASE#v}-${{ matrix.plat }}" SHA256SUMS | { sha256sum -c - 2>/dev/null || shasum -a 256 -c -; }
            mv "$tool-${TEBAKO_RELEASE#v}-${{ matrix.plat }}" "$tool"
            chmod 755 "$tool"
            ln -s "$PWD/$tool" "/usr/local/bin/$tool" 2>/dev/null \
              || sudo ln -s "$PWD/$tool" "/usr/local/bin/$tool"
          done
          tebako --version

      - name: Add the closure registries and install metanorma
        # The tebako-packages index (registry-of-registries) is not walked
        # by the CLI (still true at v2.1.0: it registers as 0 payloads —
        # the packages[] follow is a filed product gap, TODO.v2-1/22).
        # Add the feedstock registries directly. The java runtime edge does
        # NOT ride a payload registry: install pre-stages the spawned
        # runtime through the runtime release index (spec 30 §3), which the
        # config preference (recipe.yml's java block) + the step-scoped
        # TEBAKO_RUNTIME_MIRROR resolve to the pinned openjdk pair. The
        # mirror NEVER leaves this step — the first dispatch downloads the
        # primary ruby runtime from the product default base, and the
        # one-base-for-all-engines mirror would misdirect it.
        env:
          TEBAKO_RUNTIME_MIRROR: ${{ env.JAVA_RELEASES_BASE }}
        run: |
          set -euo pipefail
          tebako add-registry tfs:github:tebako-packages/metanorma
          tebako add-registry tfs:github:tebako-packages/inkscape
          printf 'runtimes:\n  java:\n    version: "%s"\n    tebako: "%s"\n' \
            "$JAVA_VERSION" "$JAVA_TEBAKO" >> "$HOME/.tebako/config.yaml"
          tebako install "metanorma@$PKG_VERSION"

      - name: Assert the store holds exactly one of each closure payload
        # Structural, not log-scraping: one .tfs per closure payload
        # (metanorma + inkscape). The java RUNTIME is not a payload — the
        # install's edge pre-staging lands it under runtimes/ (asserted
        # below). The primary RUBY runtime is deliberately absent here —
        # kind: language resolves at run time; the post-first-run step
        # asserts it.
        run: |
          set -euo pipefail
          store="$HOME/.tebako"
          for payload in metanorma inkscape; do
            n=$(ls "$store/payloads/$payload"/*.tfs 2>/dev/null | wc -l | tr -d ' ' || true)
            echo "$payload images in store: $n"
            [ "$n" = "1" ] || { echo "FAIL: $payload has $n images (expected 1)"; exit 1; }
            # the trust anchor rides every payload
            ls "$store/payloads/$payload"/*.tfs.sha256 >/dev/null
          done
          echo "store OK: 1 image each for metanorma, inkscape"

      - name: Assert the java runtime pre-staged at install
        # spec 30 §3: install_runtime_edge resolves + downloads the spawned
        # runtime into runtimes/ BEFORE the first dispatch. Exe + env image
        # + trust markers, and the image is read-only (0444).
        run: |
          set -euo pipefail
          store="$HOME/.tebako"
          n_java=$(ls -d "$store"/runtimes/java-* 2>/dev/null | wc -l | tr -d ' ' || true)
          ls -la "$store/runtimes" || true
          [ "$n_java" = "1" ] || { echo "FAIL: $n_java java runtime dirs (expected 1)"; exit 1; }
          ls "$store"/runtimes/java-*/sha256 "$store"/runtimes/java-*/origin >/dev/null
          ls "$store"/runtimes/java-*/*.tfs "$store"/runtimes/java-*/*.tfs.sha256 >/dev/null
          echo "java runtime OK: pre-staged with trust markers"

      - name: Put the shims on PATH
        run: |
          tebako-shim install-shell --shell bash || true
          echo "$HOME/.tebako/shims" >> "$GITHUB_PATH"

      - name: metanorma new site
        # `new` requires -t (flavor) and -d (doctype); the default template
        # skeleton is fetched from metanorma's git template registry (the
        # runner has network; the payload itself is offline).
        run: |
          set -euo pipefail
          metanorma new site -t iso -d international-standard
          test -d site

      - name: Assert the runtime downloaded exactly once (on first run)
        # The `new` above was the first shim dispatch: the primary ruby
        # runtime came down through the pref-less index resolution, once,
        # verified — joining the java runtime pre-staged at install.
        run: |
          set -euo pipefail
          store="$HOME/.tebako"
          n_rt=$(ls "$store/runtimes" | wc -l | tr -d ' ')
          ls -la "$store/runtimes"
          [ "$n_rt" = "2" ] || { echo "FAIL: $n_rt runtime dirs (expected 2: ruby + java)"; exit 1; }
          ls "$store"/runtimes/ruby-*/sha256 "$store"/runtimes/ruby-*/origin >/dev/null
          echo "runtime OK: exactly one ruby + the pre-staged java, trust markers present"

      - name: Drop the fixture doc with the figure
        run: |
          set -euo pipefail
          cp fixtures/site.adoc fixtures/figure.svg site/

      - name: metanorma compile (figure via inkscape payload, PDF via the spawned java runtime)
        # The PDF leg (mn2pdf) spawns `java` — the spec-30 surface rewrites
        # it to a full dispatch of the pre-staged openjdk runtime's wrapper
        # exe from the store (never a host PATH lookup; a host without java
        # compiles identically).
        # --agree-to-terms: the fontist license acceptance (a clean
        # machine's compile downloads fonts; the terms gate errors
        # otherwise — Fontist::Errors::LicensingError).
        run: |
          set -euo pipefail
          cd site
          metanorma compile site.adoc --agree-to-terms
          ls -la

      - name: Assert PDF magic bytes
        run: |
          set -euo pipefail
          pdf=$(ls site/site.pdf 2>/dev/null || ls site/*.pdf | head -1)
          [ -n "$pdf" ] || { echo "no PDF produced"; exit 1; }
          head -c 5 "$pdf" | grep -q '%PDF-' && echo "PDF magic OK: $pdf"

      - name: Tight-jail variant (input dir rw, everything else denied)
        # The jail grammar (spec 08 §1): "deny; <host>:<mount>:rw" — the
        # working directory bound rw, every other host path denied. Boot
        # under the jail + a version print proves enforcement installs and
        # the interpreter needs no host filesystem beyond the grant. (The
        # full compile in-jail also needs TMPDIR and the java subprocess;
        # the spawned runtime's OWN jail is the driver-computed union of
        # the parent's policy and the edge's declared needs (spec 30 §4) —
        # that leg joins after the un-jailed compile proves stable.)
        run: |
          set -euo pipefail
          mkdir -p /tmp/mn-jail && cp fixtures/site.adoc fixtures/figure.svg /tmp/mn-jail/
          cd /tmp/mn-jail
          TEBAKO_JAIL="deny;$(pwd):$(pwd):rw" metanorma version
          echo "jail boot OK (deny + cwd:rw)"

  dogfood-slim:
    name: pr-slim (${{ matrix.plat }})
    # Slim PR leg: install + version only (no compile — that needs fonts,
    # Java for mn2pdf, and minutes of runtime).
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-14, plat: macos-arm64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Every version flows from recipe.yml (tools.release +
      # upstream.version) — the workflow carries no literals.
      - name: Read the pins (recipe.yml is the SSOT)
        run: |
          ruby tools/pins.rb --release-only >> "$GITHUB_ENV"

      - name: Install CLI, add registry, install metanorma, exec version
        # Same runtime-edge wiring as the full leg: the java edge resolves
        # through the config pref + the step-scoped mirror at INSTALL time
        # (install_runtime_edge pre-stages the spawned runtime) — the slim
        # leg never dispatches java, but install fails without the pref.
        env:
          TEBAKO_RUNTIME_MIRROR: ${{ env.JAVA_RELEASES_BASE }}
        run: |
          set -euo pipefail
          base="https://github.com/tamatebako/tebako/releases/download/$TEBAKO_RELEASE"
          mkdir -p "$RUNNER_TEMP/tebako-bin" && cd "$RUNNER_TEMP/tebako-bin"
          curl -sSfLO "$base/SHA256SUMS"
          for tool in tebako tebako-shim; do
            curl -sSfLO "$base/$tool-${TEBAKO_RELEASE#v}-${{ matrix.plat }}"
            grep "$tool-${TEBAKO_RELEASE#v}-${{ matrix.plat }}" SHA256SUMS | { sha256sum -c - 2>/dev/null || shasum -a 256 -c -; }
            mv "$tool-${TEBAKO_RELEASE#v}-${{ matrix.plat }}" "$tool"
            chmod 755 "$tool"
            sudo ln -s "$PWD/$tool" "/usr/local/bin/$tool"
          done
          tebako add-registry tfs:github:tebako-packages/metanorma
          tebako add-registry tfs:github:tebako-packages/inkscape
          printf 'runtimes:\n  java:\n    version: "%s"\n    tebako: "%s"\n' \
            "$JAVA_VERSION" "$JAVA_TEBAKO" >> "$HOME/.tebako/config.yaml"
          tebako install "metanorma@$PKG_VERSION"
          export PATH="$HOME/.tebako/shims:$PATH"
          metanorma version | grep -E "Metanorma::Cli $PKG_VERSION"
