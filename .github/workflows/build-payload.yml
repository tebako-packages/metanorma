name: build-payload
# Feedstock build: recipe → matrix build → boot-smoke → release.
# Conventions: docs/conventions.md in tebako-packages/index.
# STATUS: deferred — the payload leg ran locally (docs/build-notes.md);
# this workflow encodes the same steps but has not run green yet (same
# situation as tebako-packages/fontist: the cold tebako-cli build via
# vcpkg is ~45 min).
on:
  push:
    branches: [main]
    tags: ["*"]
  pull_request:
  workflow_dispatch:

# One run per branch/PR-head at a time: pushing to a branch with an open
# PR would otherwise run every job twice (push + pull_request events);
# a new run cancels the stale one.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  build:
    name: aarch64-macos
    runs-on: macos-14
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build tebako-cli (tamatebako/tebako-rs, pinned)
        # Mirrors tebako-rs's own ci.yml: the dwarfs backend needs the
        # dwarfs-t C++ tree (submodule) and a vcpkg run (~45 min cold).
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: tamatebako/tebako-rs
          path: tebako-rs
          submodules: recursive

      - name: Checkout dwarfs-rs (sibling path dep)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: tamatebako/dwarfs-rs
          path: dwarfs-rs
          submodules: recursive

      - name: Native build tools + crypto deps (macOS)
        run: brew install ninja autoconf automake autoconf-archive libtool botan json-c

      - name: Set up vcpkg
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11.6
        with:
          # Must match tebako-rs ci.yml (dwarfs-t/vcpkg.json baseline).
          vcpkgGitCommitId: f14401ca0f2754347c3864da7488a9b955b4e47a
          vcpkgDirectory: ${{ github.workspace }}/.vcpkg-root

      - name: Pre-install squashfs-tools-ng (serialized)
        working-directory: tebako-rs
        run: |
          ../.vcpkg-root/vcpkg install \
            --vcpkg-root "${{ github.workspace }}/.vcpkg-root" \
            --x-wait-for-lock \
            --x-manifest-root crates/sqfs-sys \
            --x-install-root "${{ github.workspace }}/.sqfs-installed" \
            --triplet arm64-osx-static \
            --overlay-triplets crates/sqfs-sys/vcpkg_triplets \
            --overlay-ports crates/sqfs-sys/vcpkg_ports
          echo "SQFS_SYS_VCPKG_INSTALLED_DIR=${{ github.workspace }}/.sqfs-installed/arm64-osx-static" >> "$GITHUB_ENV"

      - name: cargo build tebako-cli + tfs-cli
        run: |
          cargo build --release --manifest-path tebako-rs/Cargo.toml -p tebako-cli -p tfs-cli
          echo "$GITHUB_WORKSPACE/tebako-rs/target/release" >> "$GITHUB_PATH"

      - name: Build the payload
        env:
          TEBAKO_CLI: tebako
          TFS_CLI: tfs
        run: tools/build

      - name: Boot-smoke
        # Hard rule (docs/conventions.md): the packaged tool's --version
        # runs from the image before any release publishes.
        env:
          TFS: tfs
          SHIM: out/work-aarch64-macos/prefix/o/p/ruby
        run: tools/boot_smoke out/aarch64-macos/metanorma-1.16.9-macos-arm64.tfs

      - name: Stage artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-aarch64-macos
          path: out/aarch64-macos/

  release:
    name: publish
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: macos-14
    env:
      TEBAKO_CLI: ${{ github.workspace }}/tebako-rs/target/release/tebako
      TEBAKO_HOME: ${{ github.workspace }}/.tebako
      TEBAKO_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: tamatebako/tebako
          path: tebako-rs
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: dist-*
          path: out
          merge-multiple: true
      - uses: dtolnay/rust-toolchain@e43eeffd51aefeea929f4ea14e09fd077153e788 # 1.94.1
      - uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11.6
        with:
          vcpkgGitCommitId: f14401ca0f2754347c3864da7488a9b955b4e47a
          vcpkgDirectory: ${{ github.workspace }}/.vcpkg-root
      - name: Build the tebako CLI
        env:
          DWARFS_RS_VCPKG_ROOT: ${{ github.workspace }}/.vcpkg-root
          VCPKG_ROOT: ${{ github.workspace }}/.vcpkg-root
          SQFS_SYS_VCPKG_ROOT: ${{ github.workspace }}/.vcpkg-root
          CARGO_NET_GIT_FETCH_WITH_CLI: "true"
        run: cargo build --release --manifest-path tebako-rs/Cargo.toml -p tebako-cli
      - name: Publish payloads + registry
        # tebako publish: artifacts + registry upsert + clean-cache verify
        # (the publisher home carries the dep registries for the closure proof)
        run: |
          set -euo pipefail
          "$TEBAKO_CLI" add-registry tfs:github:tebako-packages/inkscape
          "$TEBAKO_CLI" add-registry tfs:github:tebako-packages/openjdk
          "$TEBAKO_CLI" publish --name metanorma \
            --release tfs:github:tebako-packages/metanorma \
            --payload aarch64-macos="out/aarch64-macos/metanorma-1.16.9-macos-arm64.tfs" \
            --registry-out tpkg-registry.yaml
      # main is branch-protected (and the GitHub-Actions bypass is not
      # available on this plan): the registry lands by bot PR + auto-merge,
      # never by direct push. Idempotent across re-runs of the same tag.
      - name: Publish the registry entry via pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "tebako-packages[bot]"
          git config user.email "bot@tebako.org"
          git fetch origin main
          if git diff --quiet origin/main -- tpkg-registry.yaml; then
            echo "registry unchanged (or the entry already landed on main)"
            exit 0
          fi
          branch="publish/${{ github.ref_name }}-registry"
          git checkout -b "$branch"
          git add tpkg-registry.yaml
          git commit -m "publish ${{ github.ref_name }}: registry entry (macos-arm64)"
          git push origin "$branch"
          if ! gh pr view "$branch" >/dev/null 2>&1; then
            gh pr create --base main --head "$branch" \
              --title "publish ${{ github.ref_name }}: registry entry" \
              --body "Automated registry entry for ${{ github.ref_name }} (the build-payload publish job; main is protected, so the registry lands by PR)."
          fi
          gh pr merge --auto --squash "$branch"
