name: dogfood
# THE dogfood (roadmap 32): a bare runner installs the tebako CLI from the
# tebako-rs RELEASE BINARIES, adds the tebako-packages index, installs the
# just-published metanorma payload, and runs a real compile whose figure
# goes through the inkscape toolkit payload — proving the full dispatch
# chain (registry -> runtime + app payload + toolkit payload -> shim exec).
#
# GATED: tebako-rs v0.1.0 is not released yet (only v0.0.0-testN pipeline
# pre-releases exist as of 2026-07-27, and they carry no tebako-shim asset).
# When v0.1.0 is out: flip `if: false` on the dogfood job to enable it, and
# confirm the asset names in the install step below against that release.
on:
  schedule:
    - cron: "17 3 * * *"        # nightly
  pull_request:
    paths: [".github/workflows/dogfood.yml", "fixtures/**", "tpkg-registry.yaml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dogfood:
    name: ${{ matrix.triplet }}
    # FLIP when tebako-rs v0.1.0 is released (see header comment).
    if: false
    strategy:
      fail-fast: false
      matrix:
        include:
          - { triplet: x86_64-linux-gnu, os: ubuntu-24.04, plat: linux-gnu-x86_64 }
          # inkscape payload ships x86_64-linux-gnu only (phase A); the macos
          # leg joins when tebako-packages/inkscape publishes aarch64-macos.
          # - { triplet: aarch64-macos, os: macos-14, plat: macos-arm64 }
    runs-on: ${{ matrix.os }}
    env:
      TEBAKO_RELEASE: v0.1.0
      METANORMA_VERSION: "1.16.9"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the tebako CLI from the tebako-rs release (sha256-verified)
        # Nothing tebako-related is on this bare runner: no runtime, no
        # payloads, no shims — the install below is the full cold path.
        run: |
          set -euo pipefail
          base="https://github.com/tamatebako/tebako-rs/releases/download/$TEBAKO_RELEASE"
          mkdir -p "$RUNNER_TEMP/tebako-bin"
          cd "$RUNNER_TEMP/tebako-bin"
          curl -sLO "$base/SHA256SUMS"
          for tool in tebako tebako-shim; do
            curl -sLO "$base/$tool-${TEBAKO_RELEASE#v}-${{ matrix.plat }}"
            grep "$tool-${TEBAKO_RELEASE#v}-${{ matrix.plat }}" SHA256SUMS | shasum -a 256 -c -
            chmod 755 "$tool-${TEBAKO_RELEASE#v}-${{ matrix.plat }}"
            ln -s "$PWD/$tool-${TEBAKO_RELEASE#v}-${{ matrix.plat }}" "/usr/local/bin/$tool" 2>/dev/null \
              || sudo ln -s "$PWD/$tool-${TEBAKO_RELEASE#v}-${{ matrix.plat }}" "/usr/local/bin/$tool"
          done
          tebako --version

      - name: Add the tebako-packages catalog and install metanorma
        run: |
          set -euo pipefail
          tebako add-registry tfs:github:tebako-packages/index
          tebako install "metanorma@$METANORMA_VERSION"

      - name: Assert runtime + payload + inkscape each downloaded exactly once
        # Cache markers: the dispatcher's journal records every fetch; the
        # cache dirs must each hold exactly one entry for the resolved unit.
        # NOTE: the journal line format below is written against the spec-07
        # design, not a shipped v0.1.0 — confirm the actual markers when the
        # gate flips (the assertion intent is fixed: exactly one fetch each).
        run: |
          set -euo pipefail
          journal="$HOME/.tebako/journal.log"
          for unit in runtime payload inkscape; do
            n=$(grep -c "downloaded.*$unit" "$journal" || true)
            echo "$unit downloads: $n"
            [ "$n" = "1" ] || { echo "FAIL: $unit downloaded $n times (expected 1)"; exit 1; }
          done
          echo "one download each: runtime, metanorma payload, inkscape payload"

      - name: Put the shims on PATH
        run: |
          tebako-shim install-shell --shell bash || echo "$HOME/.tebako/shims" >> "$GITHUB_PATH"
          echo "$HOME/.tebako/shims" >> "$GITHUB_PATH"

      - name: metanorma new site
        # `new` requires -t (flavor) and -d (doctype); the default template
        # skeleton is fetched from metanorma's git template registry (the
        # runner has network; the payload itself is offline).
        run: |
          set -euo pipefail
          metanorma new site -t iso -d international-standard
          test -d site

      - name: Drop the fixture doc with the figure
        run: |
          set -euo pipefail
          cp fixtures/site.adoc fixtures/figure.svg site/

      - name: metanorma compile (the figure goes through inkscape's SVG path)
        run: |
          set -euo pipefail
          cd site
          metanorma compile site.adoc
          ls -la

      - name: Assert PDF magic bytes
        run: |
          set -euo pipefail
          pdf=$(ls site/site.pdf 2>/dev/null || ls site/*.pdf | head -1)
          [ -n "$pdf" ] || { echo "no PDF produced"; exit 1; }
          head -c 5 "$pdf" | grep -q '%PDF-' && echo "PDF magic OK: $pdf"

      - name: Tight-jail variant (input dir rw, everything else denied)
        # Same compile under the strictest jail: only the working directory
        # is writable/readable; the VFS denies the rest. Proves the payload
        # needs no host filesystem beyond its inputs.
        # NOTE: TEBAKO_JAIL below is a placeholder for the v0.1.0 jail knob
        # (spec 07 §jails) — confirm the actual env/flag when the gate flips.
        # mn2pdf shells out to java for the PDF leg; if the jail forbids
        # that subprocess, reduce this leg to `metanorma --version` in-jail
        # and keep the full compile to the un-jailed leg above.
        run: |
          set -euo pipefail
          mkdir -p /tmp/mn-jail && cp fixtures/site.adoc fixtures/figure.svg /tmp/mn-jail/
          cd /tmp/mn-jail
          TEBAKO_JAIL="rw:." metanorma compile site.adoc
          pdf=$(ls *.pdf | head -1)
          head -c 5 "$pdf" | grep -q '%PDF-' && echo "jail PDF magic OK: $pdf"

  dogfood-slim:
    name: pr-slim (${{ matrix.plat }})
    # Slim PR leg: install + version only (no compile — that needs fonts,
    # Java for mn2pdf, and minutes of runtime). Same gate as the full leg.
    if: false
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, plat: linux-gnu-x86_64 }
    runs-on: ${{ matrix.os }}
    env:
      TEBAKO_RELEASE: v0.1.0
      METANORMA_VERSION: "1.16.9"
    steps:
      - name: Install CLI, add registry, install metanorma, exec --version
        run: |
          set -euo pipefail
          base="https://github.com/tamatebako/tebako-rs/releases/download/$TEBAKO_RELEASE"
          mkdir -p "$RUNNER_TEMP/tebako-bin" && cd "$RUNNER_TEMP/tebako-bin"
          curl -sLO "$base/SHA256SUMS"
          for tool in tebako tebako-shim; do
            curl -sLO "$base/$tool-${TEBAKO_RELEASE#v}-${{ matrix.plat }}"
            grep "$tool-${TEBAKO_RELEASE#v}-${{ matrix.plat }}" SHA256SUMS | shasum -a 256 -c -
            chmod 755 "$tool-${TEBAKO_RELEASE#v}-${{ matrix.plat }}"
            sudo ln -s "$PWD/$tool-${TEBAKO_RELEASE#v}-${{ matrix.plat }}" "/usr/local/bin/$tool"
          done
          tebako add-registry tfs:github:tebako-packages/index
          tebako install "metanorma@$METANORMA_VERSION"
          export PATH="$HOME/.tebako/shims:$PATH"
          metanorma --version | grep -E "Metanorma::Cli $METANORMA_VERSION"
